<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chant Box</title>
<link rel="stylesheet" href="../earlymax/css/bootstrap-5-3-3.css">
<link rel="stylesheet" href="../earlymax/css/fonts.css">
<link rel="stylesheet" href="../earlymax/css/styles.css">
<style>
  /* Demo layout only; the chant box itself comes from styles.css (.chant-box) */
  /* no side nav on this page, so drop the template's 240px nav space */
  body {
    padding-left: 0 !important;
  }

  .compare {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 40px;
    align-items: start;
    max-width: 1300px;
    margin: 40px auto;
    padding: 0 16px;
  }

  .compare h2 {
    margin: 0 0 12px;
    font-size: 16px;
    line-height: 24px;
    color: #858586;
  }

  .compare .print-shot {
    display: block;
    width: 100%;
    max-width: 625px;
  }

  @media (max-width: 900px) {
    .compare {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="compare strand-earlymax em-end-the-day">
  <section>
    <h2>Print</h2>
    <img class="print-shot" src="print_chant_box.png" alt="Print version of the I’m a Firefighter chant box">
  </section>
  <section class="lesson-content">
    <h2>HTML</h2>
    <div class="chant-box">
      <p class="chant-title">I’m a Firefighter</p>
      <p class="chant-line">I’m a firefighter, my name is _____.</p>
      <p class="chant-line">I put my boots and helmet on.</p>
      <p class="chant-line">I hurry to the fire and give a shout.</p>
      <p class="chant-line">With a burst of water,</p>
      <p class="chant-line">The fire is out.</p>
    </div>
  </section>
</div>
</body>
</html>
